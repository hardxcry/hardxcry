<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Hariharan S, hardxcry. AI engineering, cybersecurity, automobiles, healthcare tech.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#db2777;#2563eb;#7c3aed" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#db2777"><animate attributeName="stop-color" values="#db2777;#f97316;#06b6d4;#db2777" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f97316"><animate attributeName="stop-color" values="#f97316;#06b6d4;#a855f7;#f97316" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .hi { font-size: 26px; font-weight: 600; fill: #fff; opacity: .92; }
      .name { font-size: 78px; font-weight: 900; fill: #fff; letter-spacing: -2px; }
      .handle { font-size: 24px; font-weight: 700; fill: #fff; opacity: .85; }
      .chip { font-size: 15px; font-weight: 800; fill: #fff; letter-spacing: .5px; }
      .pill { fill: #ffffff; fill-opacity: .2; stroke: #fff; stroke-opacity: .55; }
      .blob { opacity: .35; }
      .float1 { animation: f1 9s ease-in-out infinite; } .float2 { animation: f2 11s ease-in-out infinite; }
      .float3 { animation: f1 13s ease-in-out infinite reverse; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,22px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(26px,-18px); } }
      .wave { animation: sway 7s ease-in-out infinite alternate; }
      @keyframes sway { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <circle class="blob float1" cx="1010" cy="70" r="150" fill="#fde047"/>
  <circle class="blob float2" cx="1130" cy="260" r="110" fill="#22d3ee"/>
  <circle class="blob float3" cx="820" cy="320" r="90" fill="#f472b6"/>
  <rect width="1200" height="340" rx="26" fill="url(#shine)"/>
  <g class="wave"><path d="M-80 300 C 80 250, 220 340, 400 296 S 720 250, 900 300 S 1180 330, 1320 280 V360 H-80 Z" fill="#ffffff" fill-opacity="0.16"/></g>
  <text x="70" y="92" class="sans hi">Hey there 👋 I'm</text>
  <text x="66" y="176" class="sans name">Hariharan S</text>
  <text x="72" y="214" class="sans handle">@hardxcry</text>
  <g class="sans chip" text-anchor="middle">
    <rect class="pill" x="70" y="244" width="168" height="38" rx="19"/><text x="154" y="269">🤖 AI ENGINEERING</text>
    <rect class="pill" x="250" y="244" width="170" height="38" rx="19"/><text x="335" y="269">🛡️ CYBERSECURITY</text>
    <rect class="pill" x="432" y="244" width="152" height="38" rx="19"/><text x="508" y="269">🏎️ AUTOMOBILES</text>
    <rect class="pill" x="596" y="244" width="168" height="38" rx="19"/><text x="680" y="269">🩺 HEALTHCARE AI</text>
  </g>
</svg>
