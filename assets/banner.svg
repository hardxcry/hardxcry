<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hariharan S, hardxcry. AI engineering, cybersecurity, automobiles, healthcare tech.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="0.6" stop-color="#0a1418"/>
      <stop offset="1" stop-color="#0d2b2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#2dd4bf"/>
      <stop offset="0.8" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a7f3d0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .prompt { font-size: 17px; fill: #5eead4; }
      .name { font-weight: 800; font-size: 62px; fill: #f1f5f9; letter-spacing: -1.5px; }
      .handle { font-size: 22px; fill: #5eead4; }
      .tag { font-size: 21px; fill: #94a3b8; }
      .chip { font-size: 14px; font-weight: 600; fill: #d1fae5; }
      .box { fill: #0f2a2a; stroke: #2dd4bf; stroke-opacity: 0.45; }
      .wave { fill: none; stroke: url(#line); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
              stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: draw 6s ease-in-out infinite; }
      .cursor { fill: #5eead4; animation: blink 1.1s steps(2, start) infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 2600; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -2600; } }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>
  <path class="wave" d="M0 286 H180 l10 -14 l10 26 l10 -18 l10 6 H330 l8 -30 l10 44 l8 -14 H520 l12 -8 l12 8 H700 l8 -22 l10 38 l10 -24 l8 8 H900 l10 -12 l10 12 H1200"/>
  <text x="70" y="78" class="mono prompt">~/hardxcry $ whoami</text>
  <rect class="cursor" x="262" y="62" width="10" height="20"/>
  <text x="68" y="150" class="sans name">Hariharan S</text>
  <text x="72" y="186" class="sans tag">AI engineering geek. I build things, break things and measure them properly.</text>
  <g class="sans chip">
    <rect class="box" x="70" y="212" width="150" height="32" rx="16"/><text x="145" y="233" text-anchor="middle">AI ENGINEERING</text>
    <rect class="box" x="232" y="212" width="150" height="32" rx="16"/><text x="307" y="233" text-anchor="middle">CYBERSECURITY</text>
    <rect class="box" x="394" y="212" width="130" height="32" rx="16"/><text x="459" y="233" text-anchor="middle">AUTOMOBILES</text>
    <rect class="box" x="536" y="212" width="150" height="32" rx="16"/><text x="611" y="233" text-anchor="middle">HEALTHCARE AI</text>
  </g>
</svg>
